# workspace-ops 开发配置（本机调试用，根目录指向 D:\M_X_M）
scan:
  root: ".."
  ignore_dirs:
    - "node_modules"
    - "godot-src"
    - "bevy-src"
    - "relay"
    - "proto"
    - "export"
    - "scripts"
    - ".portfolio"
  checks:
    stack: true
    dependencies: true
    agents_md: true
    git_status: true
    tests: true
    build_artifacts: true

storage:
  database_path: "workspace-ops.db"

logging:
  level: "debug"
  format: "text"

server:
  host: "127.0.0.1"
  port: 8765
  read_timeout_seconds: 15
  write_timeout_seconds: 15
