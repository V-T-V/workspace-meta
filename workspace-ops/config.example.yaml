# workspace-ops 配置示例
# 复制为 config.yaml 或 config.dev.yaml 后按需修改。

# 扫描配置
scan:
  # 工作区根目录（默认当前目录的上级，即 D:\M_X_M）
  root: ".."
  # 忽略的目录（不算项目）：引擎源码副本 / 工具目录 / 依赖
  ignore_dirs:
    - "node_modules"
    - "godot-src"
    - "bevy-src"
    - "relay"
    - "proto"
    - "export"
    - "scripts"
    - ".portfolio"
  # 检查项开关
  checks:
    stack: true          # 识别技术栈
    dependencies: true   # 读取依赖文件
    agents_md: true      # 是否有 AGENTS.md
    git_status: true     # git 分支与 dirty
    tests: true          # 测试文件计数
    build_artifacts: true # 构建产物存在性

# 存储配置
storage:
  database_path: "workspace-ops.db"

# 日志配置
logging:
  level: "info"      # debug / info / warn / error
  format: "json"     # json / text

# Web 服务配置（serve 子命令）
server:
  host: "127.0.0.1"
  port: 8765
  read_timeout_seconds: 15
  write_timeout_seconds: 15
