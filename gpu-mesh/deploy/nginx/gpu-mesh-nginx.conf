# gpu-mesh Nginx 反向代理配置
#
# 功能：
#   - TLS 终止（wss:// / https://）保护心跳与推理数据
#   - WebSocket 长连接超时 24h（Agent 反向连接不中断）
#   - SSE 流式推理不被缓冲（X-Accel-Buffering: no）
#   - 控制台静态资源缓存
#
# 部署：
#   sudo cp deploy/nginx/gpu-mesh-nginx.conf /etc/nginx/conf.d/gpu-mesh.conf
#   # 编辑 server_name 和 ssl_certificate 路径
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS 证书（Let's Encrypt 免费）：
#   sudo certbot --nginx -d gpu-mesh.yourdomain.com

# WebSocket 升级映射（放在 http {} 块顶层，或 include 到 nginx.conf）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name gpu-mesh.yourdomain.com;   # ← 改成你的域名
    # 80 重定向到 443（强制 TLS）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gpu-mesh.yourdomain.com;   # ← 改成你的域名

    # === TLS 证书（必改）===
    ssl_certificate     /etc/letsencrypt/live/gpu-mesh.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpu-mesh.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # === Agent 反向 WS 接入（核心，长连接）===
    location /agent {
        proxy_pass http://127.0.0.1:7780;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ★ WS 长连接：24h 不超时（Agent 常驻连接）
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 大结果回流（批量/嵌入）
        proxy_buffering off;
    }

    # === SSE 事件流 + 流式推理 ===
    location /api/events {
        proxy_pass http://127.0.0.1:7780;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # ★ SSE 不缓冲，实时推送
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
    }
    location /v1/chat/completions {
        proxy_pass http://127.0.0.1:7780;
        proxy_http_version 1.1;
        proxy_buffering off;          # 流式推理（stream:true）不被缓冲
        proxy_read_timeout 300s;      # 推理可能慢，给 5 分钟
    }

    # === 其余 API（推理/批量/训练/管理）===
    location / {
        proxy_pass http://127.0.0.1:7780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # 批量/训练查询
    }

    # 访问日志（排查问题用）
    access_log /var/log/nginx/gpu-mesh-access.log;
    error_log  /var/log/nginx/gpu-mesh-error.log;
}
