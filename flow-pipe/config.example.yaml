# flow-pipe 配置示例

storage:
  database_path: "flow-pipe.db"

logging:
  level: "info"
  format: "json"

server:
  host: "127.0.0.1"
  port: 8767
  read_timeout_seconds: 30
  write_timeout_seconds: 30

# 分布式 worker（M3 才启用，M1 单机模式忽略）
worker:
  enabled: false          # true 时启动 worker 模式（cmd/worker）
  server_url: ""          # 中心调度器地址（ws://host:port）
  id: ""                  # worker 唯一 ID（空则自动生成）
