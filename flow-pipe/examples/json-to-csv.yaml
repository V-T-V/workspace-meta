# 示例 3：json → field(增删改) → csv
# 前置：准备 examples/data/users.json（数组格式）
name: json-to-csv
steps:
  - id: read
    type: source
    connector: json
    config:
      path: "examples/data/users.json"
  - id: shape
    type: transform
    connector: field
    config:
      add:
        source: "imported"
        processed_at: "2026-08-01"
      drop:
        - "internal_id"
    depends_on: [read]
  - id: write
    type: sink
    connector: csv
    config:
      path: "examples/data/users_out.csv"
    depends_on: [shape]
